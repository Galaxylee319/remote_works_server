<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>{{ title }} - Remote Works</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f7fa;
      --text: #1a1a2e;
      --text-secondary: #555;
      --border: #e0e3e8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --success: #16a34a;
      --radius: 8px;
      --max-width: 960px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif;
      --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --bg-secondary: #1e293b;
        --text: #e2e8f0;
        --text-secondary: #94a3b8;
        --border: #334155;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }
    .container { max-width: var(--max-width); margin: 0 auto; padding: 0 16px; }

    /* Header */
    header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    header .container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
    }
    header h1 a { color: var(--text); }
    header h1 a:hover { text-decoration: none; }
    header nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }
    header nav a, header nav button {
      font-size: 14px;
      padding: 6px 12px;
      border-radius: var(--radius);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }
    header nav a:hover, header nav button:hover {
      background: var(--accent);
      color: white;
      text-decoration: none;
    }

    /* Breadcrumbs */
    .breadcrumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      padding: 12px 0;
      font-size: 14px;
    }
    .breadcrumbs a { color: var(--text-secondary); }
    .breadcrumbs a:hover { color: var(--accent); }
    .breadcrumbs .sep { color: var(--text-secondary); margin: 0 2px; }

    /* Search */
    .search-bar {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }
    .search-bar input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      background: var(--bg);
      color: var(--text);
    }
    .search-bar input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }
    .search-bar button {
      padding: 10px 18px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      cursor: pointer;
    }

    /* File list */
    .file-list { list-style: none; margin: 8px 0; }
    .file-item {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 6px;
      transition: background 0.15s;
      gap: 10px;
    }
    .file-item:hover { background: var(--bg-secondary); }
    .file-item .icon {
      font-size: 22px;
      flex-shrink: 0;
      width: 32px;
      text-align: center;
    }
    .file-item .info { flex: 1; min-width: 0; }
    .file-item .info .name {
      font-weight: 600;
      font-size: 15px;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-item .info .name a { color: var(--text); display: block; }
    .file-item .info .name a:hover { color: var(--accent); }
    .file-item .info .meta {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .file-item .info .meta span { margin-right: 12px; }
    .file-item .actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .file-item .actions a {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      white-space: nowrap;
    }
    .file-item .actions a:hover {
      background: var(--accent);
      color: white;
      text-decoration: none;
    }

    /* Quick links */
    .quick-links {
      display: flex;
      gap: 8px;
      margin: 16px 0;
      flex-wrap: wrap;
    }
    .quick-links a {
      padding: 8px 16px;
      border-radius: var(--radius);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
    }
    .quick-links a:hover { background: var(--accent); color: white; text-decoration: none; }

    /* Sort controls */
    .sort-controls {
      display: flex;
      gap: 6px;
      margin: 8px 0;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .sort-controls span { color: var(--text-secondary); padding: 4px 0; }
    .sort-controls a {
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .sort-controls a.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 10px 18px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      text-decoration: none;
    }
    .btn:hover { background: var(--bg-secondary); text-decoration: none; }
    .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); color: white; border-color: var(--danger); }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }

    /* Footer */
    footer {
      text-align: center;
      padding: 24px 0;
      color: var(--text-secondary);
      font-size: 13px;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }

    /* Loading indicator */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast notifications */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: var(--radius);
      background: var(--text);
      color: var(--bg);
      font-size: 14px;
      z-index: 1000;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: var(--danger); }

    /* Responsive */
    @media (max-width: 640px) {
      header .container { gap: 8px; }
      header h1 { font-size: 16px; }
      header nav a, header nav button { font-size: 12px; padding: 5px 10px; }
      .file-item { padding: 10px 12px; flex-wrap: wrap; }
      .file-item .actions { width: 100%; justify-content: flex-end; }
      .container { padding: 0 12px; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <div class="container">
      <h1><a href="/">📁 Remote Works</a></h1>
      <nav>
        <a href="/recent">🕐 Recent</a>
        <a href="/api/logout" onclick="return confirm('Logout?')">🚪 Logout</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="container">
      Remote Works Server &middot; <a href="/">Home</a>
    </div>
  </footer>

  <div id="toast" class="toast"></div>

  <script>
    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast' + (type ? ' ' + type : '');
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => t.classList.remove('show'), 3000);
    }
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>

{% extends "base.html" %}
{% block title %}{{ entry.name }} · 远程工作区{% endblock %}

{% block content %}

<nav class="breadcrumbs">
  <a href="/browse/">首页</a>
  <span class="sep">/</span>
  <span>{{ entry.name }}</span>
</nav>

<div class="generic-file">
  <div class="icon">&#128196;</div>
  <h2>{{ entry.name }}</h2>
  <p class="meta">{{ entry.size_str }} &middot; {{ entry.mtime_str }}</p>
  <p class="meta">类型: {{ entry.type }}</p>
  <br>
  <a href="/download/{{ entry.path }}" download class="download-btn">下载文件</a>
  <br><br>
  <a href="/browse/">返回文件列表</a>
</div>

{% endblock %}

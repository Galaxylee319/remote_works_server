{% extends "base.html" %}
{% block title %}{{ entry.name }} - Remote Works{% endblock %}

{% block content %}

<nav class="breadcrumbs">
  <a href="/browse/">Home</a>
  <span class="sep">/</span>
  <span>{{ entry.name }}</span>
</nav>

<div class="generic-file">
  <div class="icon">&#128196;</div>
  <h2>{{ entry.name }}</h2>
  <p class="meta">{{ entry.size_str }} &middot; {{ entry.mtime }}</p>
  <p class="meta">Type: {{ entry.type }}</p>
  <br>
  <a href="/download/{{ entry.path }}" download class="download-btn">Download File</a>
  <br><br>
  <a href="/browse/">Back to Files</a>
</div>

{% endblock %}

{% extends "base.html" %}
{% block title %}{{ entry.name }} - Remote Works{% endblock %}

{% block content %}

<nav class="breadcrumbs">
  <a href="/browse/">Home</a>
  <span class="sep">/</span>
  <span>{{ entry.name }}</span>
</nav>

<div class="action-bar">
  <a href="/browse/">返回</a>
  <a href="/download/{{ entry.path }}" download>下载</a>
</div>

<div style="margin-bottom:8px;">
  <span class="meta">{{ entry.size_str }} &middot; {{ entry.mtime_str }} &middot; {{ entry.extension }}</span>
  {% if truncated %}
  <span class="meta warning">（文件过大，仅预览前 2MB）</span>
  {% endif %}
</div>

<pre class="text-viewer">{{ content }}</pre>

{% endblock %}

{% extends "base.html" %}
{% block title %}{{ entry.name }} · 远程工作区{% endblock %}

{% block content %}

<nav class="breadcrumbs">
  <a href="/browse/">首页</a>
  <span class="sep">/</span>
  <span>{{ entry.name }}</span>
</nav>

<div class="action-bar">
  <a href="/browse/">返回</a>
  <a href="/download/{{ entry.path }}" download>下载图片</a>
</div>

<div class="image-viewer">
  <img src="/api/files/{{ entry.path }}" alt="{{ entry.name }}">
</div>

<div class="action-bar" style="margin-top:12px;">
  <span class="meta">{{ entry.size_str }} &middot; {{ entry.mtime_str }}</span>
  <a href="/download/{{ entry.path }}" download>下载</a>
</div>

{% endblock %}

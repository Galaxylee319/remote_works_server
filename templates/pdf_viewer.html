{% extends "base.html" %}
{% block title %}{{ entry.name }} - Remote Works{% endblock %}

{% block content %}

<nav class="breadcrumbs">
  <a href="/browse/">Home</a>
  <span class="sep">/</span>
  <span>{{ entry.name }}</span>
</nav>

<div class="action-bar">
  <a href="/browse/">返回</a>
  <a href="/download/{{ entry.path }}" download>下载 PDF</a>
</div>

<div class="pdf-viewer-container">
  <iframe src="/api/files/{{ entry.path }}#toolbar=0&navpanes=0" title="{{ entry.name }}">
    <div class="pdf-fallback">
      <p>浏览器不支持内嵌 PDF 预览，请直接下载。</p>
      <a href="/download/{{ entry.path }}" download class="download-btn">下载 PDF</a>
    </div>
  </iframe>
</div>

<div class="action-bar" style="margin-top:12px;">
  <span class="meta">{{ entry.size_str }} &middot; {{ entry.mtime_str }}</span>
  <a href="/download/{{ entry.path }}" download>下载</a>
</div>

{% endblock %}
